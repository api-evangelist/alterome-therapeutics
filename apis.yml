name: Alterome Therapeutics
description: Alterome Therapeutics is a clinical-stage precision oncology company founded in 2021
  and headquartered in San Diego, California, backed by Canaan Partners. The company designs
  alteration-specific cancer therapies using deep biology and chemistry expertise paired with an
  in-house computational chemistry platform ("The Kraken"), a custom CPU/GPU compute array for
  physics-based molecular simulation and drug design. Its clinical pipeline includes ALTA2618, a
  mutation-selective inhibitor for AKT1 E17K-driven cancers, and ALTA3263, an oral pan-KRAS ON-state
  inhibitor targeting more than 90% of KRAS mutations in cancer. Alterome was surfaced through the
  Canaan Partners portfolio and added to the API Evangelist network as a company profile; it publishes
  no public developer or API surface.
